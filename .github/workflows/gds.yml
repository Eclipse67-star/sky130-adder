name: OpenLane 2 GDS Build
on: [push]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build_gds:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Nix with OpenLane Cache
        uses: DeterminateSystems/nix-installer-action@main
        with:
          extra-conf: |
            extra-substituters = https://openlane.cachix.org
            extra-trusted-public-keys = openlane.cachix.org-1:qqdwh+QMNGmZAuyeQJTH9ErW57OWSvdtuwfBKdS254E=

      - name: Run OpenLane 2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VOLARE_REPO_OWNER: chipfoundry
        run: nix run --accept-flake-config github:chipfoundry/openlane2 -- config.json

      - name: Prepare GDS for 3D Viewer
        run: |
          mkdir -p site
          GDS_FILE=$(find runs -path "*/final/gds/*.gds" | head -n 1)
          cp "$GDS_FILE" site/design.gds
          cat << 'EOF' > site/index.html
          <!DOCTYPE html>
          <html>
            <head>
              <meta http-equiv="refresh" content="0; url=https://tinytapeout.com" />
            </head>
            <body>
              <p>Redirecting to <a href="https://tinytapeout.com">Tiny Tapeout 3D GDS Viewer</a>...</p>
            </body>
          </html>
          EOF

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/

      - name: Upload Full Run Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gds-output
          path: runs/

  deploy_viewer:
    needs: build_gds
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: https://tinytapeout.com
    steps:
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4

      - name: Generate 3D GDS Viewer Link
        run: |
          echo "### View Your Chip in 3D" >> $GITHUB_STEP_SUMMARY
          echo "[Open in Tiny Tapeout 3D GDS Viewer](https://tinytapeout.com)" >> $GITHUB_STEP_SUMMARY
